# RADIN Flutter UI — scaffold only.
#
# BUILD-REQUIRED SCAFFOLD: no Flutter SDK in this workspace. Run `flutter create`
# to regenerate platform folders, then `flutter pub get` + `flutter analyze` on
# a Flutter-capable machine. No third-party packages are required; dart:ffi and
# flutter/material are all this UI needs.

name: radin
description: "RADIN Network Engine — mobile companion UI."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/